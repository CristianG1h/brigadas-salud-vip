[build]
  command = "node scripts/patch-paises-nacimiento.mjs && node scripts/patch-autocomplete-empresas.mjs"
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/logo-vip.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
