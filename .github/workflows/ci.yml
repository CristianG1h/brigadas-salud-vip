name: Validar formulario de brigadas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sintaxis de patches
        run: |
          node --check scripts/patch-paises-nacimiento.mjs
          node --check scripts/patch-autocomplete-empresas-v3.mjs
          node --check scripts/patch-autocomplete-empresas-v4.mjs
          node --check scripts/patch-autocomplete-empresas-v5.mjs
      - name: Aplicar build del formulario
        run: |
          node scripts/patch-paises-nacimiento.mjs
          node scripts/patch-autocomplete-empresas-v3.mjs
          node scripts/patch-autocomplete-empresas-v4.mjs
          node scripts/patch-autocomplete-empresas-v5.mjs
      - name: Verificar autocomplete y relación instalados
        run: |
          grep -q 'AUTOCOMPLETE_EMPRESAS_V3' index.html
          grep -q 'AUTOCOMPLETE_EMPRESAS_V4_RELACION' index.html
          grep -q 'AUTOCOMPLETE_EMPRESAS_V5_MISION_CANONICA' index.html
          grep -q 'misionCanonicaParaAcuerdo' index.html
          grep -q 'misiones.length===1' index.html
          grep -q 'sugerenciasEmpresa' index.html
          grep -q 'empresaRelacionSeleccionada' index.html
          grep -q 'acuerdoComercialOrigen' index.html
          grep -q 'empresaMisionOrigen' index.html
          grep -q 'empresaParaRegistro' index.html
          grep -q 'Una sola sugerencia por Acuerdo Comercial' index.html
          grep -q 'Coincide con empresa en misión' index.html
          grep -q 'Puede elegir una sugerencia o escribir una empresa nueva' index.html
          grep -q 'relaciones-v67/parte-' index.html
